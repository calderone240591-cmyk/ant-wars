<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#5b8f2e">
  <title>Мурашині Війни</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #6fa33a;
                 touch-action: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: radial-gradient(circle at 50% 40%, #8cc04f, #4f7d27); color: #fff6dc;
              font-family: "Trebuchet MS", system-ui, sans-serif; text-align: center; gap: 18px; padding: 16px; }
    #loader h1 { margin: 0; font-size: clamp(28px, 7vw, 54px); text-shadow: 0 4px 0 #2e4a14; letter-spacing: 1px; }
    #loader .ant { font-size: clamp(54px, 14vw, 96px); animation: bob 0.9s ease-in-out infinite; }
    #bar { width: min(70vw, 360px); height: 18px; border-radius: 9px; background: #2e4a14; overflow: hidden; box-shadow: inset 0 2px 4px #0006; }
    #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffd34d, #ff9a2e); border-radius: 9px; transition: width .2s; }
    #msg { font-size: 15px; opacity: .85; }
    @keyframes bob { 50% { transform: translateY(-10px) rotate(-6deg); } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="ant">🐜</div>
    <h1>Мурашині Війни</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Завантаження…</div>
  </div>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/webgl.loader.js";
    var config = {
      dataUrl: buildUrl + "/webgl-v20261101200400.data.unityweb",
      frameworkUrl: buildUrl + "/webgl-v20261101200400.framework.js.unityweb",
      codeUrl: buildUrl + "/webgl-v20261101200400.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "AntWars",
      productName: "Мурашині Війни",
      productVersion: "1.0",
      // на телефонах обмежуємо щільність пікселів — плавніше й менше гріється
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 1.75 : 2),
    };
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill");
    var msg = document.querySelector("#msg");
    // заборона контекстного меню й масштабування сторінки жестами
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { fill.style.width = (100 * p) + "%"; })
        .then(function () { document.querySelector("#loader").style.display = "none"; })
        .catch(function (e) { msg.textContent = "Помилка: " + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
